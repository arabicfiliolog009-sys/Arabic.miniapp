<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arab AI Tutor (A1 - C2+)</title>
  <script src="https://telegram.org"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <span class="badge" id="level-badge">Daraja: A1</span>
        <button id="settings-btn" class="icon-btn">⚙️ API</button>
      </div>
      <div class="level-selector">
        <button class="lvl-btn active" data-lvl="A1">A1</button>
        <button class="lvl-btn" data-lvl="A2">A2</button>
        <button class="lvl-btn" data-lvl="B1">B1</button>
        <button class="lvl-btn" data-lvl="B2">B2</button>
        <button class="lvl-btn" data-lvl="C1">C1</button>
        <button class="lvl-btn" data-lvl="C2+">C2+</button>
      </div>
    </header>

    <div id="api-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Groq API Kalitini Kiriting</h3>
        <input type="password" id="api-key-input" placeholder="gsk_...">
        <button id="save-api-btn" class="primary-btn">Saqlash</button>
      </div>
    </div>

    <main id="chat-box">
      <div class="msg ai">
        <p class="ar-text">أَهْلاً وَسَهْلاً بِكَ! أَنَا صَدِيقُكَ الذَّكِيُّ. كَيْفَ حَالُكَ الْيَوْمَ؟</p>
        <span class="uz-hint">Xush kelibsiz! Men sizning aqlli do'stingizman. Bugun ahvolingiz qanday?</span>
      </div>
    </main>

    <footer>
      <button id="hint-btn" class="secondary-btn">💡 Yordam (تلميح)</button>
      <button id="mic-btn" class="mic-btn">🎤 Gapirish</button>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
